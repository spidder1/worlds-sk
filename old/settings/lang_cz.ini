         <h2 id='sync_script' class='highlight highlight2' style='font-size:22px !important'>Synchronizace = spuštění modulu</h2> <br>

        <p>Můžete spouštět importní modul následovně:
       </p>

        <ul>
        <li>a) manuálně - přes webový prohlížeč. Vložíte URL skriptu do adresního řádku prohlížeče a načtete stránku. </li>
        <li>a) automaticky - přes CRON, který si nastavíte na hostingu či vašem serveru. Příkaz může být např. "wget URL_IMPORTNIHO_SKRIPTU"</li>
         </ul>
        <p>
		Pro oba způsoby platí, že v ten moment se provede vložení nových produktů, aktualizace stávajících produktu či deaktivace produktů. Vše dle nastavení modulu.
		<Br>
		URL adresa skriptu je v zahlaví této stránky.
