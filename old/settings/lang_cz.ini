CategoryMappingToolInfo = {
 	   <h3 style='padding-left:9px;font-size:16px;text-decoration:underline'>Mapování kategorií</h3>


	        <p>Umožňuje základní nastavení mapování kategorií z Datafeedu dodavatele do vašeho internetového obchodu – lze tedy nastavit do jakých kategorií se zboží bude ukládat. <br />
V pravé části tabulky přiřadíte kategorii Vašeho obchodu do které se nahrají produkty kategorie dodavatele (ty jsou na levé straně).<br />
Samozřejmě je možné do jedné kategorie v eshopu namapovat dvě a více kategorie dodavatele. Lze to i naopak.<br>
Co se týče stromové struktury Vašeho eshopu, je potřeba ji vytvořit předem v administraci obchodu a nebo můžete mít stejnou strukturu kategorií jako dodavatel.<br>
            <Br>
Jen produkty, které jsou v namapovaných kategoriích jsou importovany. Produkty, které jsou již naimportovány a jejich kategorie byla odmapována jsou deaktivovány.

    <br>

}
