name: eD catalog synchronization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Import mode
        required: true
        default: stock-price
        type: choice
        options:
          - stock-price
          - full
  schedule:
    - cron: '17 */2 * * *'
    - cron: '43 2 * * 0'

permissions:
  contents: read

concurrency:
  group: ed-catalog-import
  cancel-in-progress: false

jobs:
  stock-price:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stock-price' || github.event.schedule == '17 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm sync:stock-price
        env:
          ED_ENDPOINT_URL: https://private-ws-sk.elinkx.biz/service.asmx
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

  full-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' || github.event.schedule == '43 2 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm sync:catalog
        env:
          ED_CATALOG_SCOPE: it-only
          ED_ENDPOINT_URL: https://private-ws-sk.elinkx.biz/service.asmx
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
