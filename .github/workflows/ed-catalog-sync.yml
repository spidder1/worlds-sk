name: eD catalog synchronization

# Writes straight into the Neon database the storefront reads. The previous
# version of this workflow pushed into the retired Supabase project, so nothing
# it imported ever reached production.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Import mode
        required: true
        default: full
        type: choice
        options:
          - stock-price
          - full

permissions:
  contents: read

concurrency:
  group: ed-catalog-import
  cancel-in-progress: false

env:
  ED_ENDPOINT_URL: https://private-ws-sk.elinkx.biz/service.asmx
  IMPORT_TRANSPORT: neon
  IMPORT_BATCH_SIZE: 200

jobs:
  stock-price:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'stock-price'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm --filter @worlds/importer run sync:stock-price
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}

  full-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm --filter @worlds/importer run sync:catalog
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          ED_CATALOG_SCOPE: it-only
          # Launch catalogue is ASUS + Lenovo. Widening this widens the shop;
          # products outside the list are never retired by a full run.
          ED_BRAND_SCOPE: ${{ vars.ED_BRAND_SCOPE || 'ASUS,Lenovo' }}
