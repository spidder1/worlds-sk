name: eD catalog synchronization

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Import mode
        required: true
        default: sample
        type: choice
        options:
          - sample
          - full
  schedule:
    - cron: '7 * * * *'
    - cron: '17 */2 * * *'
    - cron: '43 2 * * 0'

permissions:
  contents: read

concurrency:
  group: ed-catalog-import
  cancel-in-progress: false

jobs:
  stock-price-sync:
    if: github.event_name == 'schedule' && github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm import:neon:stock
        env:
          ED_STOCK_ONLY: true
          ED_ENDPOINT_URL: https://private-ws-sk.elinkx.biz/service.asmx
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  sample-catalog:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'sample' || github.event.schedule == '17 */2 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm import:sample-neon
        env:
          ED_SAMPLE_ONLY: true
          ED_SAMPLE_LIMIT: 250
          ED_SAMPLE_BRANDS: ASUS,Lenovo
          ED_MIN_COST_EUR: ${{ vars.ED_MIN_COST_EUR || '0' }}
          ED_ENDPOINT_URL: https://private-ws-sk.elinkx.biz/service.asmx
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  sample-catalog-weekly:
    if: github.event.schedule == '43 2 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm import:sample-neon
        env:
          ED_SAMPLE_ONLY: true
          ED_SAMPLE_LIMIT: 250
          ED_SAMPLE_BRANDS: ASUS,Lenovo
          ED_MIN_COST_EUR: ${{ vars.ED_MIN_COST_EUR || '0' }}
          ED_ENDPOINT_URL: https://private-ws-sk.elinkx.biz/service.asmx
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  full-catalog-manual:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @worlds/types build && pnpm --filter @worlds/ed-client build && pnpm --filter @worlds/importer build
      - run: pnpm import:neon
        env:
          ED_SAMPLE_ONLY: false
          ED_SAMPLE_BRANDS: ALL
          ED_MIN_COST_EUR: ${{ vars.ED_MIN_COST_EUR || '0' }}
          ED_ENDPOINT_URL: https://private-ws-sk.elinkx.biz/service.asmx
          ED_LOGIN: ${{ secrets.ED_LOGIN }}
          ED_PASSWORD: ${{ secrets.ED_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
